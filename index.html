<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>FootDelegue</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="auth">
  <h1>FootDelegue</h1>
  <div class="card">
    <label>Email</label>
    <input type="email" id="auth-email" autocomplete="username">
    <label>Mot de passe</label>
    <input type="password" id="auth-password" autocomplete="current-password">
    <p id="auth-error" class="subtitle" style="color:#f87171"></p>
    <button id="auth-signin" class="primary" style="width:100%;margin-top:10px">Se connecter</button>
    <button id="auth-signup" class="ghost" style="width:100%;margin-top:10px">Créer un compte</button>
  </div>
  <div id="debug-log" style="font-family:monospace;font-size:11px;color:#94a3b8;white-space:pre-wrap;padding:10px;word-break:break-word"></div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <h2>FootDelegue</h2>
    <button id="btn-logout" class="ghost" style="min-height:36px;padding:0 12px">Déconnexion</button>
  </div>

  <div id="page-accueil" class="page"></div>
  <div id="page-match" class="page hidden"></div>
  <div id="page-materiel" class="page hidden"></div>
  <div id="page-taches" class="page hidden"></div>
  <div id="page-historique" class="page hidden"></div>

  <div class="bottom-nav">
    <button data-page="accueil"><span class="icon">🏠</span>Accueil</button>
    <button data-page="match"><span class="icon">⚽</span>Match</button>
    <button data-page="materiel"><span class="icon">🎒</span>Matériel</button>
    <button data-page="taches"><span class="icon">✅</span>Tâches</button>
    <button data-page="historique"><span class="icon">📋</span>Historique</button>
  </div>
</div>

<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
